# model configuration
model:
  seed: 0
  checkpoint: null  # load weights from checkpoint
  model_class: vit
  model_params:
    hidden_size: 1280
    num_hidden_layers: 32
    num_attention_heads: 16
    intermediate_size: 5120
    hidden_act: "gelu"
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    initializer_range: 0.02
    layer_norm_eps: 1.e-12
    image_size: 224 # usually 224
    patch_size: 14 # vit-mae-huge uses patch14, not patch16
    num_channels: 3 # 3 for RGB
    qkv_bias: True
    decoder_num_attention_heads: 16
    decoder_hidden_size: 512
    decoder_num_hidden_layers: 8
    decoder_intermediate_size: 2048
    mask_ratio: 0.75 # 0 for no masking, usually 0.75 (MAE)
    norm_pix_loss: False
    pretrained_model: facebook/vit-mae-huge # ~630M encoder, for size-ablation comparison to SABLE

    embed_size: 1280 # projected embedding size, used for contrastive learning
    temp_scale: False # temperature scaling for contrastive loss
    random_init: False # keep pretrained weights, same training regime as the base config
    use_infoNCE: False # use InfoNCE loss
    infoNCE_weight: 0.03 # weight for InfoNCE loss
    use_perceptual_loss: False # use perceptual loss (AlexNet features)
    lambda_perceptual: 10.0 # weight for perceptual loss

# training configuration
training:
  seed: 0
  imgaug: default  # default | top-down
  train_batch_size: 32    # per GPU, reduced from base config due to larger model memory footprint
  val_batch_size: 256
  test_batch_size: 32
  num_epochs: 800
  num_workers: 8  # Number of CPU workers for the DataLoader
  num_gpus: 1
  num_nodes: 1
  # frequency to log training metrics
  log_every_n_steps: 10
  # frequency to log validation metrics
  check_val_every_n_epoch: 5

# optimizer configuration
optimizer:
  type: AdamW
  accumulate_grad_batches: 1
  lr: 5.e-5
  wd: 0.05
  warmup_pct: 0.15 # cosine/linear
  gamma: 0.95     # step
  div_factor: 10  # cosine
  scheduler: cosine # step/cosine/linear

# data configuration
data:
  data_dir: /PATH/TO/DATA
