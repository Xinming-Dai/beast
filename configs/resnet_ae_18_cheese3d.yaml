# model configuration
model:
  seed: 0
  checkpoint: null  # train from scratch; no cheese3d-pretrained encoder exists
  model_class: resnet
  model_params:
    backbone: resnet18
    num_latents: 768  # null is a fully convolutional model, integer value forces bottleneck; matched to SABLE's per-view latent dim
    image_size: 224  # usually 224
    num_channels: 3  # 3 for RGB

# training configuration
training:
  seed: 0
  imgaug: default
  train_batch_size: 24       # per GPU
  val_batch_size: 24
  test_batch_size: 24
  num_epochs: 280             # matches SABLE's 15710 steps (batch_size_per_gpu=16) on this dataset
  num_workers: 8              # Number of CPU workers for the DataLoader
  num_gpus: 1
  num_nodes: 1
  log_every_n_steps: 10       # frequency to log training metrics
  check_val_every_n_epoch: 5  # frequency to log validation metrics

# optimizer configuration
optimizer:
  type: AdamW
  accumulate_grad_batches: 1
  lr: 5.e-4
  wd: 0.05
  scheduler: cosine  # {step, cosine}
  warmup_pct: 0.15   # for cosine
  div_factor: 10     # for cosine
  gamma: 0.5         # for step
  steps:             # for step
    - 200
    - 400

# data configuration
data:
  data_dir: /work/hdd/bfsr/xdai3/cheese3d_cam/cheese3d_cam
  session_names:
    - 20231031_B20_chew_bl_000
    - 20231031_B21_chew_bl_000
    - 20231031_B26_chew_bl_000
    - 20231031_B31_chew_bl_000
    - 20231031_B6_chew_temperature_000
    - 20231031_B20_chew_temperature_000
    - 20231031_B21_chew_temperature_000
    - 20231031_B26_chew_temperature_000
    - 20231031_B31_chew_temperature_000
  cameras:
    - TL
    - TR
