# Phase 2 Ablation — Baseline: init_gs=false (no Kabsch, no pseudo-correspondence).
#
# Ablation comparison with B-pseudoKabsch to isolate the effect of Kabsch init.
# All other settings are identical: same dataset, same checkpoint, same steps.
#
# Key diff from B-pseudoKabsch:
#   gaussians.init_gs: false  → skip Kabsch branch entirely
#   training.gs_reg_loss_weight: 0.0  → no GS regularization
#   (everything else identical)
#
# Ablation questions:
#   Q1: Does Kabsch init help or hurt PSNR?
#   Q2: Does gs_reg stay zero (no init = no regularization)?
#   Q3: Do rendered images look better/worse?

inference: false
evaluation: false

model:
  model_class: sable
  seed: 0

  gaussians:
    init_gs: false         # ABLATION: no Kabsch init
    n_gaussians: 1
    range_setting:
      type: linear_depth
      near: 0
      far: 8
    sh_degree: 3
    upsampler:
      upsample_factor: 1

  gs_per_pixel_sqrt: 1
  hard_pixelalign: true

  image_tokenizer:
    image_size: 320
    in_channels: 3
    patch_size: 16
    use_off_the_shelf: false

  input_with_pe: true
  near_plane: 0.2

  pose_latent:
    canonical: middle
    length: 1
    mode: pairwise

  scaling_bias: -3.0
  scaling_max: -2.0

  target_image:
    height: 320
    width: 320

  transformer:
    d: 768
    d_head: 64
    decoder_n_layer: 8
    depth_init: true
    encoder_geom_n_layer: 16
    encoder_n_layer: 16
    fix_decoder: false
    neck_n_layer: 1
    special_init: true
    use_qk_norm: true

  vda:
    enabled: true
    mode: online          # same as B-pseudoKabsch
    cache_root: null
    checkpoint_path: null
    encoder: vitb
    metric: false
    debug_save: false
    debug_dir: null

  use_deferred_rendering: false
  use_gsplat: true
  mask_ratio: 0.0

  merge_pcd:
    num_points: 3
    debug_merged_pcd: false
    debug_merged_pcd_num_batches: 16
    correspondence_cache_root: null

optimizer:
  type: AdamW
  lr: 0.00002
  wd: 0.05
  beta1: 0.9
  beta2: 0.95
  warmup: 600
  div_factor: 1.0
  final_div_factor: 1.0
  scheduler: cosine

training:
  dataset_name: beast.data.cheese3d_dataset.Cheese3DDataset
  dataset_path: /home/jqh/NeuralWorkshops/E-RayZer-private/data/cheese3d_cam
  views: [L, R]
  sessions: null
  allow_missing_masks: false           # same as B-pseudoKabsch (requires masks for mask_bbox comparison to be fair on same sessions)
  correspondence_mode: mask_bbox       # still load masks even if not used (keeps session set identical)
  mask_threshold: 0

  image_size: 320
  start_frame: 0
  frame_step: 1
  max_frames_per_session: 4            # IDENTICAL to B-pseudoKabsch

  ibl_training_regime: two_input_reconstruction
  num_views: 2
  num_input_views: 2
  num_target_views: 2

  val_split_ratio: 0.1
  val_every: 0
  val_score_frame_weight: 1.0
  val_score_perceptual_weight: 1.0
  val_score_depth_weight: 1.0
  save_val_best_checkpoint: false

  batch_size_per_gpu: 1               # IDENTICAL to B-pseudoKabsch
  grad_accum_steps: 1
  num_workers: 0
  prefetch_factor: 2

  amp_dtype: bf16
  use_amp: true
  use_tf32: true

  checkpoint_dir: ./outputs/cheese3d_phase2_ablation_baseline
  checkpoint_every: 0
  checkpoint_steps: []

  resume_ckpt: null
  reset_training_state: true
  max_fwdbwd_passes: 8               # IDENTICAL to B-pseudoKabsch (8 steps for more signal)
  print_every: 1
  save_visuals: true                  # ABLATION: save rendered visuals for comparison
  vis_num_samples: 1
  vis_max_views: 2
  render_video: false

  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  allowed_gradnorm_factor: 5.0
  no_pass_steps: 50

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.3
  gs_reg_loss_weight: 1.0            # stays at 1.0 but init_gs=false means gs_reg=0
  gs_decay_steps: 0

  scene_scale_factor: 1.35
  random_split: false
  random_shuffle: false

  view_selector:
    type: all
    fallback_type: all
    overlap_path_template: null
    use_curriculum: false
    curriculum_iter: 0
    curriculum_start_min_overlap: 1.0
    curriculum_start_max_overlap: 1.0
    min_overlap: 0.0
    max_overlap: 1.0
    min_frame_dist: 1
    max_frame_dist: 1
    curriculum_start_min_frame_dist: 1
    curriculum_start_max_frame_dist: 1
