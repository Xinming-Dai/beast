# SABLE IBL smoke config — extends sable_ibl3d.yaml with overrides for short
# smoke runs. Use via `python -m beast.cli.main train --config .../sable_ibl3d.yaml --overrides ...`
# plus the cell-level overrides from run_one_cell.sh.
#
# This file is documentation/reference; the actual base config that ships with
# the repo is configs/sable/sable_ibl3d.yaml. We do NOT duplicate that config
# here to avoid drift.

