#                training.checkpoint_every=10 optimizer.warmup=2
#                training.dataset_path=/data/jqh/Datasets/beast3d-data/sable_ibl_4b00
#                training.session_names=4b00df29-3769-43be-bb40-128b1cba6d35
#                training.checkpoint_dir=$OUT training.resume_ckpt=...
#                model.vda.mode=online model.vda.cache_root=null
#                model.vda.encoder=vitb model.vda.metric=false
#                model.vda.repo_root=/home/jqh/NeuralWorkshops/third_party/VDA
#                model.vda.checkpoint_path=/home/jqh/NeuralWorkshops/third_party/VDA/checkpoints/video_depth_anything_vitb.pth
#                model.merge_pcd.correspondence_cache_root=/data/jqh/Datasets/beast3d-data/sable_ibl_4b00/litpose_correspondences/processed_correspondences"
#
# Reference: docs/sable/extract_data_for_sable.md and
