# Phase 3 NVS: Novel View Synthesis on Cheese3D with LP3D Kabsch.
#
# Protocol:
#   - Context views (inputs): L, R (indices 0, 1 in the views list)
#   - Held-out target views: BC, TC, TL, TR (indices 2, 3, 4, 5)
#   - Kabsch correspondences still come from L/R pairs (selected LP3D keypoints)
#
# Correspondence pipeline:
#   1. LP3D (mvt_3d_loss_450_0) → keypoints × L/R views → CSV predictions
#   2. convert_csv_to_litpose_cache.py → litpose_matches.npz bundles
#   3. Cheese3DDataset (correspondence_mode=cache) → leftcamera_xy / rightcamera_xy / confidence
#   4. Sable.forward (init_gs=true) → Kabsch alignment → gs_reg_loss
#
# Evaluation metrics:
#   - PSNR (held-out views only)
#   - LPIPS (if lpips_loss_weight > 0)
#   - Kabsch inlier ratio
#
# Experiment variants:
#   init_gs | resume_ckpt            | description
#   -------|------------------------|----------------------------------
#   true   | null                   | from-scratch + LP3D Kabsch
#   true   | erayzer_dl3dv.pt       | zero-shot NVS (erayzer init + LP3D Kabsch)
#   false  | erayzer_dl3dv.pt       | zero-shot NVS (erayzer init, no Kabsch)

inference: false
evaluation: false

model:
  model_class: sable
  seed: 42

  gaussians:
    init_gs: true              # KEY: enable Kabsch point cloud initialization
    n_gaussians: 1
    range_setting:
      type: linear_depth
      near: 0
      far: 8
    sh_degree: 3
    upsampler:
      upsample_factor: 1

  gs_per_pixel_sqrt: 1
  hard_pixelalign: true

  image_tokenizer:
    image_size: 320
    in_channels: 3
    patch_size: 16
    use_off_the_shelf: false

  input_with_pe: true
  near_plane: 0.2

  pose_latent:
    canonical: middle
    length: 1
    mode: pairwise

  scaling_bias: -3.0
  scaling_max: -2.0

  target_image:
    height: 320
    width: 320

  transformer:
    d: 768
    d_head: 64
    decoder_n_layer: 8
    depth_init: true
    encoder_geom_n_layer: 16
    encoder_n_layer: 16
    fix_decoder: false
    neck_n_layer: 1
    special_init: true     # active when resume_ckpt is null
    use_qk_norm: true

  vda:
    enabled: true
    mode: online             # VDA runs online (fast, ~0.5s per frame on A100)
    cache_root: null
    checkpoint_path: null
    encoder: vitb
    metric: false
    debug_save: false
    debug_dir: null

  use_deferred_rendering: false
  use_gsplat: true
  mask_ratio: 0.0           # No masking — full image for correspondence quality

  merge_pcd:
    num_points: 3           # minimum correspondences for Kabsch
    debug_merged_pcd: false
    debug_merged_pcd_num_batches: 16
    correspondence_cache_root: /data/jqh/Datasets/E-RayZer-private/data/cheese3d_stage1_lp3d_cache   # Override via CLI

optimizer:
  type: AdamW
  lr: 0.0001               # Same as from-scratch; lower LR for fine-tuning
  wd: 0.05
  beta1: 0.9
  beta2: 0.95
  warmup: 200
  div_factor: 1.0
  final_div_factor: 1.0
  scheduler: cosine

training:
  # ── Dataset ──────────────────────────────────────────────────────────────────
  dataset_name: beast.data.cheese3d_dataset.Cheese3DDataset
  dataset_path: /data/jqh/Datasets/E-RayZer-private/data/cheese3d_cam
  views: [L, R, BC, TC, TL, TR]   # All 6 views; context=first 2, targets=last 4
  sessions: null                    # Override via CLI; null = all sessions
  allow_missing_masks: true

  # ── Correspondence ───────────────────────────────────────────────────────────
  correspondence_mode: cache   # Load from LP3D npz bundles (L/R only)
  max_empty_bundle_ratio: 0.0
  mask_threshold: 0

  # ── Image / frame sampling ───────────────────────────────────────────────────
  image_size: 320
  start_frame: 0
  frame_step: 1
  max_frames_per_session: null

  # ── NVS View Regime ─────────────────────────────────────────────────────────
  # views = [L, R, BC, TC, TL, TR] (indices 0..5)
  # input_view_indices: [0, 1] → L, R = context views (Kabsch source)
  # target_view_indices: [2, 3, 4, 5] → BC, TC, TL, TR = held-out targets
  ibl_training_regime: nvs
  num_views: 6
  num_input_views: 2
  num_target_views: 4
  input_view_indices: [0, 1]
  target_view_indices: [2, 3, 4, 5]

  # ── Validation ────────────────────────────────────────────────────────────────
  val_split_ratio: 0.1
  val_every: 50
  val_score_frame_weight: 1.0
  val_score_perceptual_weight: 1.0
  val_score_depth_weight: 1.0
  save_val_best_checkpoint: true

  # ── Training ─────────────────────────────────────────────────────────────────
  batch_size_per_gpu: 1
  grad_accum_steps: 1
  num_workers: 4
  prefetch_factor: 2

  amp_dtype: bf16
  use_amp: true
  use_tf32: true

  checkpoint_dir: ./outputs/cheese3d_nvs
  checkpoint_every: 0
  checkpoint_steps: []

  resume_ckpt: null            # Override via CLI:
                              #   null            → from-scratch (special_init=true)
                              #   erayzer_dl3dv.pt → zero-shot NVS evaluation
  reset_training_state: true
  max_fwdbwd_passes: 5000
  print_every: 1
  save_visuals: true
  vis_num_samples: 2
  vis_max_views: 4            # Show all 4 held-out target views in visuals
  render_video: true

  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  allowed_gradnorm_factor: 5.0
  no_pass_steps: 50

  # ── Losses ───────────────────────────────────────────────────────────────────
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.3
  gs_reg_loss_weight: 1.0   # Key: drives Gaussians toward Kabsch-aligned positions
  gs_decay_steps: 0

  scene_scale_factor: 1.35
  random_split: false
  random_shuffle: false

  view_selector:
    type: all
    fallback_type: all
    overlap_path_template: null
    use_curriculum: false
    curriculum_iter: 0
    curriculum_start_min_overlap: 1.0
    curriculum_start_max_overlap: 1.0
    min_overlap: 0.0
    max_overlap: 1.0
    min_frame_dist: 1
    max_frame_dist: 1
    curriculum_start_min_frame_dist: 1
    curriculum_start_max_frame_dist: 1
